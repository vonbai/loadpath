# One local gate: `npm test` (acceptance + contract + measurement, ~30s) is
# what a change passes before it lands. Everything heavier lives HERE and runs
# once per release tag, remotely — the mutation check (is the suite itself
# alive), the Node 18/22/24 matrix, the cold caches. A failure here stops the
# release, never the development loop.
#
# This battery runs at the release boundary and on demand, and at no other
# time, because mutation testing is a release blocker rather than a push
# metric: a surviving mutant stops a release, and re-proving that on every push
# buys a number nobody reads at a cost somebody pays.
#
# What it adds over a local run is cross-platform truth, which is a release
# concern by nature — Node 18's glob semantics against 22 and 24, the Linux
# toolchain pins, and the analyzers meeting a cold cache rather than the warm
# one every development machine has.
name: Release battery

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # The mutation leg sets this, not the other two: 82 exercised mutants, each
    # a full acceptance run measured at 15 s. Six lanes on an 18-way machine run
    # them in 4.6 minutes; one lane is that 15 s times 82, or 21 minutes. A
    # hosted runner takes fewer lanes and a slower suite in each, so the ceiling
    # sits well above the measurement rather than just above it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # co-change and relocations need real history
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # The pinned Go corpora declare their own toolchain; 1.23 is older than
      # cli/cli's, and with GOPROXY=off the analyzer cannot fetch a newer one.
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false

      - name: Acceptance tests
        run: node --test tests/loadpath.test.mjs

      # A green suite that survives feature deletion is not a suite. v0.1.0's
      # let 14 of 20 one-line deletions pass, including the one that broke its
      # own headline claim, so a surviving mutant fails the build.
      - name: Mutation check
        if: matrix.node-version == '22'
        run: node tests/mutate.mjs

      # The scan itself refuses to reach the network, so the cache is warmed
      # here, explicitly, rather than as a side effect of a read.
      - name: Warm the Go module cache for the pinned corpora
        if: matrix.node-version == '22'
        run: node tests/measure.mjs --warm

      # Published numbers are recomputed from pinned public commits.
      - name: Reproducible measurement
        if: matrix.node-version == '22'
        run: node tests/measure.mjs

      - name: Scan this repository end to end
        run: node skills/loadpath/scripts/loadpath.mjs . --since 20.years --structure

      - name: Skill contract
        run: node tests/contract.mjs
