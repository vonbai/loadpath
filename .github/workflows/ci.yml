name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: loadpath-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # co-change and relocations need real history
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # The pinned Go corpora declare their own toolchain; 1.23 is older than
      # cli/cli's, and with GOPROXY=off the analyzer cannot fetch a newer one.
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false

      - name: Acceptance tests
        run: node --test tests/loadpath.test.mjs

      # A green suite that survives feature deletion is not a suite. v0.1.0's
      # let 14 of 20 one-line deletions pass, including the one that broke its
      # own headline claim, so a surviving mutant fails the build.
      - name: Mutation check
        if: matrix.node-version == '22'
        run: node tests/mutate.mjs

      # The scan itself refuses to reach the network, so the cache is warmed
      # here, explicitly, rather than as a side effect of a read.
      - name: Warm the Go module cache for the pinned corpora
        if: matrix.node-version == '22'
        run: node tests/measure.mjs --warm

      # Published numbers are recomputed from pinned public commits.
      - name: Reproducible measurement
        if: matrix.node-version == '22'
        run: node tests/measure.mjs

      - name: Scan this repository end to end
        run: node skills/loadpath/scripts/loadpath.mjs . --since 20.years --structure

      - name: Skill contract
        run: node tests/contract.mjs
